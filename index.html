<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #060913;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    color: #e2e8f0;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = window.innerWidth;
  let H = window.innerHeight;
  let dpr = window.devicePixelRatio || 1;
  canvas.width = W;
  canvas.height = H;

  window.addEventListener('resize', () => {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = window.devicePixelRatio || 1;
    canvas.width = W;
    canvas.height = H;
  });

  window.__rafCount = 0;
  window.__startTime = performance.now();
  let lastNow = performance.now();

  const BLOCK_W = 24;
  const BLOCK_H = 32;

  // Rolling 240-frame window for percentiles (p50/p95/p99) and deviation strip
  const HISTORY_LEN = 240;
  const deltaHistory = new Float32Array(HISTORY_LEN);
  let historyIdx = 0;
  let historyCount = 0;

  const STANDARD_REFRESH_RATES = [240, 165, 144, 120, 90, 75, 60, 48, 30];

  function fmtMs(val, signed = false) {
    const abs = Math.abs(val);
    const str = abs >= 100 ? Math.min(999.9, abs).toFixed(1) : abs.toFixed(2);
    if (!signed) return str.padStart(5, ' ');
    return ((val >= 0 ? '+' : '-') + str).padStart(6, ' ');
  }

  const sortBuf = new Float32Array(HISTORY_LEN);

  function percentileSorted(sorted, p) {
    if (sorted.length === 0) return 0;
    const k = (sorted.length - 1) * (p / 100);
    const lo = Math.floor(k);
    const hi = Math.ceil(k);
    if (lo === hi) return sorted[lo];
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (k - lo);
  }

  function resolveBaseline(p50) {
    if (p50 <= 0) return { dt: 16.667, hzLabel: '60Hz' };
    for (const hz of STANDARD_REFRESH_RATES) {
      const target = 1000 / hz;
      if (Math.abs(p50 - target) / target <= 0.025) {
        return { dt: target, hzLabel: hz + 'Hz' };
      }
    }
    const estHz = Math.round(1000 / p50);
    return { dt: p50, hzLabel: Math.min(999, estHz) + 'Hz' };
  }

  // 1. HARD INVARIANT: Draw top-left 18-block barcode
  function drawBarcode(frameIdx) {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, BLOCK_W * 20, BLOCK_H + 8);
    // Block 0: White calibration guard
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, BLOCK_W, BLOCK_H);
    // Block 1: Black calibration guard
    ctx.fillStyle = '#000000';
    ctx.fillRect(BLOCK_W, 0, BLOCK_W, BLOCK_H);
    // Blocks 2..17: 16-bit binary representation of frameIdx (MSB first)
    for (let b = 0; b < 16; b++) {
      const bit = (frameIdx >> (15 - b)) & 1;
      ctx.fillStyle = bit ? '#ffffff' : '#000000';
      ctx.fillRect((b + 2) * BLOCK_W, 0, BLOCK_W, BLOCK_H);
    }
  }

  // 2. High-precision VSync Strobe / Persistence Radial Dial
  function drawStrobeDial(cx, cy, radius, frameIdx) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius + 18, 0, Math.PI * 2);
    ctx.fillStyle = '#0c1322';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#1e293b';
    ctx.stroke();

    // 60-tick ring markers
    const totalTicks = 60;
    for (let t = 0; t < totalTicks; t++) {
      const angle = (t / totalTicks) * Math.PI * 2 - Math.PI / 2;
      const isMajor = (t % 5 === 0);
      const innerR = radius - (isMajor ? 14 : 7);
      const outerR = radius;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(angle) * innerR, cy + Math.sin(angle) * innerR);
      ctx.lineTo(cx + Math.cos(angle) * outerR, cy + Math.sin(angle) * outerR);
      ctx.strokeStyle = isMajor ? '#64748b' : '#334155';
      ctx.lineWidth = isMajor ? 2.5 : 1;
      ctx.stroke();
    }

    // Persistence trail (last 8 frames with decaying alpha)
    for (let trail = 7; trail >= 0; trail--) {
      const pastFrame = frameIdx - trail;
      if (pastFrame < 0) continue;
      const tick = pastFrame % totalTicks;
      const angle = (tick / totalTicks) * Math.PI * 2 - Math.PI / 2;
      const alpha = trail === 0 ? 1.0 : Math.max(0.12, 0.7 - trail * 0.08);

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle) * (radius - 3), cy + Math.sin(angle) * (radius - 3));
      ctx.strokeStyle = trail === 0 ? '#38bdf8' : 'hsla(' + ((pastFrame * 18) % 360) + ', 95%, 65%, ' + alpha + ')';
      ctx.lineWidth = trail === 0 ? 4 : 2;
      ctx.stroke();

      // Outer head dot
      ctx.beginPath();
      ctx.arc(cx + Math.cos(angle) * (radius - 5), cy + Math.sin(angle) * (radius - 5), trail === 0 ? 5 : 2.5, 0, Math.PI * 2);
      ctx.fillStyle = trail === 0 ? '#f0f9ff' : 'hsla(' + ((pastFrame * 18) % 360) + ', 100%, 70%, ' + alpha + ')';
      ctx.fill();
    }

    // Center hub
    ctx.beginPath();
    ctx.arc(cx, cy, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#0284c7';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#38bdf8';
    ctx.stroke();

    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('VSYNC STROBE (60T)', cx, cy + radius + 12);
    ctx.restore();
  }

  // 3. Centered Delta-T Jitter / Deviation Strip (TestUFO-style ±ms around baseline)
  function drawFrameTimingDeviation(x, y, w, h, currentDt, baseline) {
    ctx.save();
    ctx.fillStyle = 'rgba(12, 19, 34, 0.85)';
    ctx.fillRect(x, y, w, h);
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#1e293b';
    ctx.strokeRect(x, y, w, h);

    // Header row (fixed-width strings so text never shifts horizontally)
    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = '#94a3b8';
    ctx.textAlign = 'left';
    ctx.fillText('rAF JITTER vs ' + baseline.dt.toFixed(2) + 'ms (' + baseline.hzLabel + ')', x + 10, y + 15);

    ctx.fillStyle = '#e2e8f0';
    ctx.textAlign = 'right';
    ctx.fillText('Δt: ' + fmtMs(currentDt) + 'ms  (' + fmtMs(currentDt - baseline.dt, true) + 'ms)', x + w - 10, y + 15);

    const plotX = x + 48;
    const plotY = y + 24;
    const plotW = Math.max(40, w - 58);
    const plotH = Math.max(20, h - 32);
    const midY = plotY + plotH / 2;
    const halfScaleMs = baseline.dt <= 10.5 ? 12 : 20;

    // Guide lines: ±halfScale, ±halfScale/2, and 0ms center
    ctx.strokeStyle = '#1e293b';
    ctx.beginPath();
    ctx.moveTo(plotX, plotY);
    ctx.lineTo(plotX + plotW, plotY);
    ctx.moveTo(plotX, plotY + plotH);
    ctx.lineTo(plotX + plotW, plotY + plotH);
    ctx.stroke();

    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = '#334155';
    ctx.beginPath();
    ctx.moveTo(plotX, plotY + plotH * 0.25);
    ctx.lineTo(plotX + plotW, plotY + plotH * 0.25);
    ctx.moveTo(plotX, plotY + plotH * 0.75);
    ctx.lineTo(plotX + plotW, plotY + plotH * 0.75);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = '#475569';
    ctx.beginPath();
    ctx.moveTo(plotX, midY);
    ctx.lineTo(plotX + plotW, midY);
    ctx.stroke();

    // Axis labels in dedicated left gutter
    ctx.fillStyle = '#94a3b8';
    ctx.font = '9px monospace';
    ctx.textAlign = 'right';
    ctx.fillText('+' + halfScaleMs + 'ms', x + 42, plotY + 6);
    ctx.fillText('0ms', x + 42, midY + 3);
    ctx.fillText('-' + halfScaleMs + 'ms', x + 42, plotY + plotH);

    // Signed deviation bars scrolling right-to-left
    const barStep = plotW / HISTORY_LEN;
    for (let i = 0; i < historyCount; i++) {
      const slot = HISTORY_LEN - historyCount + i;
      const idx = (historyIdx - historyCount + i + HISTORY_LEN) % HISTORY_LEN;
      const sampleDt = deltaHistory[idx];
      const err = sampleDt - baseline.dt;
      const clamped = Math.max(-halfScaleMs, Math.min(halfScaleMs, err));
      const px = (clamped / halfScaleMs) * (plotH / 2);
      const ratio = Math.abs(err) / baseline.dt;

      if (ratio < 0.08) {
        ctx.fillStyle = '#22c55e';
      } else if (ratio < 0.22) {
        ctx.fillStyle = '#facc15';
      } else if (ratio < 0.55) {
        ctx.fillStyle = '#fb923c';
      } else {
        ctx.fillStyle = '#f87171';
      }

      const x0 = Math.round(plotX + slot * barStep);
      const x1 = Math.round(plotX + (slot + 1) * barStep);
      const bw = Math.max(1, x1 - x0);
      if (Math.abs(px) < 1.5) {
        ctx.fillRect(x0, midY - 1, bw, 2);
      } else if (px > 0) {
        ctx.fillRect(x0, midY - px, bw, px);
      } else {
        ctx.fillRect(x0, midY, bw, -px);
      }
    }

    ctx.restore();
  }

  // 4. Chroma / Luma Subsampling & Color Gamut Inspection Bars
  function drawChromaSharpness(x, y, w, h) {
    ctx.save();
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);

    // 1px alternating black & white vertical luma stripes (Nyquist test)
    const stripeW = Math.floor(w / 4);
    for (let px = 0; px < stripeW; px += 2) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x + px, y, 1, h);
      ctx.fillStyle = '#000000';
      ctx.fillRect(x + px + 1, y, 1, h);
    }

    // 1px alternating red & cyan chroma sharpness stripes (4:2:0 subsampling torture)
    const chromaX = x + stripeW + 4;
    for (let px = 0; px < stripeW; px += 2) {
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(chromaX + px, y, 1, h);
      ctx.fillStyle = '#06b6d4';
      ctx.fillRect(chromaX + px + 1, y, 1, h);
    }

    // 8-bit smooth gradient ramp to reveal quantization banding
    const gradX = chromaX + stripeW + 4;
    const gradW = w - (gradX - x);
    const ramp = ctx.createLinearGradient(gradX, 0, gradX + gradW, 0);
    ramp.addColorStop(0, '#000000');
    ramp.addColorStop(0.5, '#475569');
    ramp.addColorStop(1, '#ffffff');
    ctx.fillStyle = ramp;
    ctx.fillRect(gradX, y, gradW, h);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '9px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('1px LUMA', x + 2, y + h + 10);
    ctx.fillText('1px CHROMA 4:2:0', chromaX + 2, y + h + 10);
    ctx.fillText('8-BIT BANDING RAMP', gradX + 2, y + h + 10);
    ctx.restore();
  }

  // 5. Dynamic Moving Stress Elements (smooth multi-speed scrolling)
  function drawStressMotion(f, hue1, hudAreaRight, hudAreaBottom) {
    const startY = BLOCK_H + 20;
    const bannerY = H - 36;
    const motionH = Math.max(120, H - startY - 260);

    // Multi-color dynamic backdrop gradient
    const grad = ctx.createLinearGradient(0, startY, W, H);
    grad.addColorStop(0, 'hsl(' + hue1 + ', 65%, 12%)');
    grad.addColorStop(1, 'hsl(' + ((hue1 + 130) % 360) + ', 70%, 14%)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, startY, W, H - startY);

    // Dynamic floating velocity bars across canvas (restricted to open areas to keep HUD & graphs pristine)
    for (let i = 0; i < 14; i++) {
      const speed = 6 + i * 2.5;
      const bx = ((f * speed + i * 197) % (W + 260)) - 130;
      // Position bars either below HUD/telemetry area or in right half of screen
      let by = startY + 20 + ((i * 47) % Math.max(80, motionH - 50));
      if (bx < hudAreaRight && by < hudAreaBottom) {
        by = hudAreaBottom + (by - startY);
      }
      if (by + 30 > bannerY - 14) {
        by = bannerY - 50;
      }
      const barHue = (hue1 + i * 25) % 360;
      ctx.fillStyle = 'hsla(' + barHue + ', 90%, 60%, 0.8)';
      ctx.fillRect(bx, by, 110, 26);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px monospace';
      ctx.fillText('#' + (i + 1), bx + 6, by + 17);
    }

    // High-speed horizontally scrolling text banner (tests temporal motion smearing)
    ctx.fillStyle = '#090d16';
    ctx.fillRect(0, bannerY - 14, W, 40);
    const scrollText = 'PROMOTION 120HZ VSYNC BENCHMARK - TESTING AV1 HARDWARE ENCODING & CDP SCREEN RECORDING FIDELITY - FRAME ' + String(f).padStart(6, '0') + ' - ';
    const textW = 1200;
    const textX = -((f * 12) % textW);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 14px monospace';
    for (let ox = textX; ox < W + textW; ox += textW) {
      ctx.fillText(scrollText, ox, bannerY + 12);
    }
  }

  function render(now) {
    window.__render = render;
    window.__rafCount++;
    const f = window.__rafCount;
    const dt = Math.max(0.1, now - lastNow);
    lastNow = now;

    // Frame 1 compares against script-init performance.now(); record inter-rAF deltas from frame 2 onward.
    if (f > 1) {
      deltaHistory[historyIdx] = dt;
      historyIdx = (historyIdx + 1) % HISTORY_LEN;
      if (historyCount < HISTORY_LEN) historyCount++;
    }

    let windowSum = 0;
    for (let i = 0; i < historyCount; i++) {
      const v = deltaHistory[i];
      sortBuf[i] = v;
      windowSum += v;
    }
    const sorted = sortBuf.subarray(0, historyCount);
    sorted.sort();

    const p50 = historyCount > 0 ? percentileSorted(sorted, 50) : 0;
    const p95 = historyCount > 0 ? percentileSorted(sorted, 95) : 0;
    const p99 = historyCount > 0 ? percentileSorted(sorted, 99) : 0;
    const baseline = resolveBaseline(p50);

    const elapsed = (now - window.__startTime) / 1000;
    const rollingFpsNum = windowSum > 0 ? (1000 * historyCount) / windowSum : 0;
    const rollingFps = Math.min(999.9, rollingFpsNum).toFixed(1).padStart(5, ' ');
    const hue1 = (f * 2.5) % 360;

    // Layout coordinates
    const hudW = Math.min(580, W - 48);
    const hudH = 148;
    const hudX = 24;
    const hudY = BLOCK_H + 24;
    const sparkW = hudW;
    const sparkH = 104;
    const sparkX = 24;
    const sparkY = hudY + hudH + 16;
    const chromaW = hudW;
    const chromaH = 22;
    const chromaX = 24;
    const chromaY = sparkY + sparkH + 16;

    const strobeRadius = 58;
    const strobeX = Math.min(W - strobeRadius - 32, hudX + hudW + strobeRadius + 36);
    const strobeY = hudY + strobeRadius + 8;
    const showStrobe = strobeX - strobeRadius > hudX + hudW + 10 && strobeX + strobeRadius < W;
    const hudAreaRight = showStrobe ? strobeX + strobeRadius + 24 : hudX + hudW + 20;

    // Draw dynamic background & moving motion stress elements
    drawStressMotion(f, hue1, hudAreaRight, chromaY + chromaH + 24);

    // Live Telemetry HUD Panel
    ctx.save();
    ctx.fillStyle = 'rgba(6, 10, 20, 0.88)';
    ctx.fillRect(hudX, hudY, hudW, hudH);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#38bdf8';
    ctx.strokeRect(hudX, hudY, hudW, hudH);

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 20px monospace';
    ctx.fillText('rAF FRAME: #' + String(f).padStart(6, '0') + ' (0x' + f.toString(16).toUpperCase().padStart(4, '0') + ')', hudX + 16, hudY + 28);

    // 16-bit binary display matching barcode
    const binStr = (f & 0xffff).toString(2).padStart(16, '0');
    ctx.fillStyle = '#94a3b8';
    ctx.font = '12px monospace';
    ctx.fillText('BARCODE BITS: [W B ' + binStr.slice(0, 8) + ' ' + binStr.slice(8) + ']', hudX + 16, hudY + 50);

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 15px monospace';
    ctx.fillText('IN-PAGE rAF: ' + rollingFps + ' FPS  |  t = ' + Math.min(9999.99, elapsed).toFixed(2).padStart(7, ' ') + 's', hudX + 16, hudY + 76);

    ctx.fillStyle = '#e2e8f0';
    ctx.font = '13px monospace';
    ctx.fillText(
      'Δt: ' + fmtMs(dt) + 'ms  (p50: ' + fmtMs(p50) + ' / p95: ' + fmtMs(p95) + ' / p99: ' + fmtMs(p99) + 'ms)',
      hudX + 16,
      hudY + 102,
    );

    ctx.fillStyle = '#a7f3d0';
    ctx.fillText('VIEWPORT: ' + W + 'x' + H + ' (dpr: ' + dpr + ')', hudX + 16, hudY + 128);
    ctx.restore();

    // VSync Strobe Dial (placed to the right of the HUD if space permits)
    if (showStrobe) {
      drawStrobeDial(strobeX, strobeY, strobeRadius, f);
    }

    // Centered frame-timing deviation strip (TestUFO-style ±ms around baseline)
    drawFrameTimingDeviation(sparkX, sparkY, sparkW, sparkH, dt, baseline);

    // Chroma / Luma subsampling & 8-bit banding inspection strip
    drawChromaSharpness(chromaX, chromaY, chromaW, chromaH);

    // Top-left 18-block 16-bit barcode (always drawn last on top)
    drawBarcode(f);

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
