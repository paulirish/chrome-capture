<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Custom DOM Cursor &amp; Click Styling</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --panel: #131c31;
      --border: #24324d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --spring: linear(0, 0.45 12%, 0.88 26%, 1.07 42%, 1.02 58%, 0.99 76%, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg) 68%);
      font: 500 17px/1.4 system-ui, -apple-system, sans-serif;
      color: var(--text);
      user-select: none;
    }

    .studio {
      width: min(880px, 90vw);
      padding: 36px 40px;
      border-radius: 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55);
      display: grid;
      gap: 28px;
    }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #64748b;
    }

    #status {
      font-size: 15px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    button {
      color: inherit;
      font: inherit;
      transition: background 140ms, border-color 140ms, box-shadow 140ms;
    }

    @media (prefers-reduced-motion: no-preference) {
      button {
        transition:
          background 140ms,
          border-color 140ms,
          box-shadow 140ms,
          scale 210ms ease-out;
        transition-timing-function: ease, ease, ease, var(--spring);
      }
      button:active { scale: 0.96; }
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .preset {
      display: grid;
      gap: 6px;
      padding: 18px 20px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: #0f172a;
      text-align: left;
    }

    .preset:hover {
      background: #16223b;
      border-color: #3b4f73;
    }

    .preset.active {
      background: #172542;
      border-color: var(--swatch);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--swatch) 25%, transparent);
    }

    .preset-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 650;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 10px var(--swatch);
    }

    .preset-sub {
      font-size: 14px;
      color: var(--muted);
    }

    .playground {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
    }

    .control {
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #1b2742;
      font: 600 16px/1.2 inherit;
      font-variant-numeric: tabular-nums;
    }

    .control:hover {
      background: #243456;
      border-color: #47608c;
      box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.16);
    }

    .control.on,
    .control.on:hover {
      background: #059669;
      border-color: #34d399;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body>
  <main class="studio">
    <div class="header">
      <div class="eyebrow">DOM Cursor Overlay · Live Restyle</div>
      <div id="status">Active style: Studio Arrow</div>
    </div>

    <div class="presets">
      <button class="preset active" id="preset-studio" data-preset="studio">
        <span class="preset-title"><span class="dot"></span>Studio Arrow</span>
        <span class="preset-sub">Oversized pointer + tilt</span>
      </button>
      <button class="preset" id="preset-agent" data-preset="agent">
        <span class="preset-title"><span class="dot"></span>Agent Badge</span>
        <span class="preset-sub">Pointer + floating @agent tag</span>
      </button>
      <button class="preset" id="preset-touch" data-preset="touch">
        <span class="preset-title"><span class="dot"></span>Touch Puck</span>
        <span class="preset-sub">Circular tap cursor + ripple</span>
      </button>
    </div>

    <div class="playground">
      <button class="control" id="hover-target">Hover Target</button>
      <button class="control" id="rec-toggle">120fps Lock: OFF</button>
      <button class="control" id="pulse-btn">Clicks: 0</button>
    </div>
  </main>

  <script>
    const PRESETS = {
      studio: { kind: 'arrow', color: '#f43f5e', size: 32 },
      agent:  { kind: 'arrow', color: '#6366f1', size: 30, badge: '@agent' },
      touch:  { kind: 'puck',  color: '#22d3ee', size: 38 },
    };

    const status = document.getElementById('status');
    const presetButtons = document.querySelectorAll('.preset');

    for (const btn of presetButtons) {
      const preset = PRESETS[btn.dataset.preset];
      btn.style.setProperty('--swatch', preset.color);
      btn.addEventListener('click', () => {
        presetButtons.forEach(b => b.classList.toggle('active', b === btn));
        window.setCursorPreset?.(preset);
        status.textContent = 'Active style: ' + btn.querySelector('.preset-title').textContent;
      });
    }

    document.getElementById('hover-target').addEventListener('pointerenter', () => {
      status.textContent = 'Hovered preview (no click ring)';
    });

    document.getElementById('rec-toggle').addEventListener('click', (e) => {
      const on = e.currentTarget.classList.toggle('on');
      e.currentTarget.textContent = '120fps Lock: ' + (on ? 'ON' : 'OFF');
      status.textContent = 'Toggled 120fps lock ' + (on ? 'ON' : 'OFF');
    });

    let clicks = 0;
    document.getElementById('pulse-btn').addEventListener('click', (e) => {
      e.currentTarget.textContent = 'Clicks: ' + (++clicks);
      status.textContent = 'Recorded click #' + clicks;
    });
  </script>
</body>
</html>
