<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Custom DOM Cursor &amp; Click Styling</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --panel: #131c31;
      --border: #24324d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --spring: linear(0, 0.45 12%, 0.88 26%, 1.07 42%, 1.02 58%, 0.99 76%, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg) 68%);
      font: 500 17px/1.4 system-ui, -apple-system, sans-serif;
      color: var(--text);
      user-select: none;
    }

    .studio {
      width: min(880px, 90vw);
      padding: 36px 40px;
      border-radius: 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55);
      display: grid;
      gap: 28px;
    }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #64748b;
    }

    #status {
      font-size: 15px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .preset {
      display: grid;
      gap: 6px;
      padding: 18px 20px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: #0f172a;
      color: inherit;
      font: inherit;
      text-align: left;
      transition: background 140ms, border-color 140ms, box-shadow 140ms;
    }

    @media (prefers-reduced-motion: no-preference) {
      .preset {
        transition:
          background 140ms,
          border-color 140ms,
          box-shadow 140ms,
          scale 220ms ease-out;
        transition-timing-function: ease, ease, ease, var(--spring);
      }
      .preset:active { scale: 0.97; }
    }

    .preset:hover {
      background: #16223b;
      border-color: #3b4f73;
    }

    .preset.active {
      background: #172542;
      border-color: var(--swatch);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--swatch) 25%, transparent);
    }

    .preset-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 650;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 10px var(--swatch);
    }

    .preset-sub {
      font-size: 14px;
      color: var(--muted);
    }

    .playground {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
    }

    .control {
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #1b2742;
      color: var(--text);
      font: 600 16px/1.2 inherit;
      font-variant-numeric: tabular-nums;
      transition: background 130ms, border-color 130ms, box-shadow 130ms;
    }

    @media (prefers-reduced-motion: no-preference) {
      .control {
        transition:
          background 130ms,
          border-color 130ms,
          box-shadow 130ms,
          scale 200ms ease-out;
        transition-timing-function: ease, ease, ease, var(--spring);
      }
      .control:active { scale: 0.96; }
    }

    .control:hover {
      background: #243456;
      border-color: #47608c;
      box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.16);
    }

    .control.on,
    .control.on:hover {
      background: #059669;
      border-color: #34d399;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body>
  <main class="studio">
    <div class="header">
      <div class="eyebrow">DOM Cursor Overlay · Live Restyle</div>
      <div id="status">Active style: Studio Arrow</div>
    </div>

    <div class="presets">
      <button class="preset active" id="preset-studio" data-preset="studio" style="--swatch: #f43f5e">
        <span class="preset-title"><span class="dot"></span>Studio Arrow</span>
        <span class="preset-sub">Oversized pointer + tilt</span>
      </button>
      <button class="preset" id="preset-agent" data-preset="agent" style="--swatch: #818cf8">
        <span class="preset-title"><span class="dot"></span>Agent Badge</span>
        <span class="preset-sub">Pointer + floating @agent tag</span>
      </button>
      <button class="preset" id="preset-touch" data-preset="touch" style="--swatch: #22d3ee">
        <span class="preset-title"><span class="dot"></span>Touch Puck</span>
        <span class="preset-sub">Circular tap cursor + ripple</span>
      </button>
    </div>

    <div class="playground">
      <button class="control" id="hover-target">Hover Target</button>
      <button class="control" id="rec-toggle">120fps Lock: OFF</button>
      <button class="control" id="pulse-btn">Clicks: 0</button>
    </div>
  </main>

  <script>
    const PRESETS = {
      studio: {
        kind: 'arrow',
        size: 32,
        fill: '#f43f5e',
        stroke: '#ffffff',
        ringColor: 'rgba(244, 63, 94, 0.95)',
        ringFill: 'rgba(244, 63, 94, 0.22)',
        ringSize: 78,
      },
      agent: {
        kind: 'arrow',
        size: 30,
        fill: '#6366f1',
        stroke: '#ffffff',
        badge: '@agent',
        ringColor: 'rgba(129, 140, 248, 0.95)',
        ringFill: 'rgba(99, 102, 241, 0.22)',
        ringSize: 78,
      },
      touch: {
        kind: 'puck',
        size: 38,
        fill: 'rgba(34, 211, 238, 0.32)',
        stroke: '#22d3ee',
        ringColor: 'rgba(34, 211, 238, 0.95)',
        ringFill: 'rgba(6, 182, 212, 0.24)',
        ringSize: 86,
      },
    };

    const status = document.getElementById('status');
    const presetButtons = document.querySelectorAll('.preset');

    for (const btn of presetButtons) {
      btn.addEventListener('click', () => {
        const key = btn.dataset.preset;
        presetButtons.forEach(b => b.classList.toggle('active', b === btn));
        window.setCursorPreset?.(PRESETS[key]);
        status.textContent = 'Active style: ' + btn.querySelector('.preset-title').textContent;
      });
    }

    document.getElementById('hover-target').addEventListener('pointerenter', () => {
      status.textContent = 'Hovered preview (no click ring)';
    });

    let locked = false;
    document.getElementById('rec-toggle').addEventListener('click', (e) => {
      locked = !locked;
      e.currentTarget.textContent = '120fps Lock: ' + (locked ? 'ON' : 'OFF');
      e.currentTarget.classList.toggle('on', locked);
      status.textContent = locked ? 'Toggled 120fps lock ON' : 'Toggled 120fps lock OFF';
    });

    let clicks = 0;
    document.getElementById('pulse-btn').addEventListener('click', (e) => {
      clicks += 1;
      e.currentTarget.textContent = 'Clicks: ' + clicks;
      status.textContent = 'Recorded click #' + clicks;
    });
  </script>
</body>
</html>
