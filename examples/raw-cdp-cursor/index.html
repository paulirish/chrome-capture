<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Raw CDP · Scripted Bezier + Click Ring</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      font: 600 18px/1.4 system-ui, sans-serif;
      color: #f8fafc;
    }
    .card {
      display: grid;
      gap: 22px;
      padding: 40px 44px;
      border-radius: 18px;
      background: #1e293b;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      text-align: center;
      min-width: 520px;
    }
    .label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
    }
    .row {
      display: flex;
      gap: 24px;
      justify-content: center;
    }
    button {
      padding: 14px 26px;
      border: 0;
      border-radius: 10px;
      background: #3b82f6;
      color: #fff;
      font: inherit;
      cursor: pointer;
      transition: transform 100ms, background 120ms, box-shadow 120ms;
    }
    button:hover {
      background: #2563eb;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35);
    }
    button:active {
      transform: scale(0.95);
    }
    button.active {
      background: #10b981;
    }
    #status {
      color: #cbd5e1;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="label">Raw CDP · Scripted Bezier + Click Ring</div>
    <div id="status">Waiting for input...</div>
    <div class="row">
      <button id="alpha">Alpha</button>
      <button id="beta">Beta</button>
      <button id="gamma">Gamma</button>
    </div>
  </div>
  <script>
    const buttons = document.querySelectorAll('button');
    for (const btn of buttons) {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('status').textContent = 'Clicked ' + btn.textContent;
      });
    }
  </script>
</body>
</html>
